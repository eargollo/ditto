# Example docker-compose for Ditto.
# Uses the image published to GitHub Container Registry. Add "build: ." to build from source instead.
# Mount your shared folders under /scan so you can add e.g. /scan/Photos as a scan root in the UI.
#
# Important: persist Postgres data. Mount postgres data out (ditto-postgres-data) so the database
# survives container recreates. Ditto itself does not need a persistent volume; all state is in Postgres.

services:
  postgres:
    image: postgres:18-alpine
    container_name: ditto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ditto
      POSTGRES_PASSWORD: ditto
      POSTGRES_DB: ditto
      PGDATA: /var/lib/postgresql/data/pgdata 
    volumes:
      - ditto-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ditto -d ditto"]
      interval: 2s
      timeout: 5s
      retries: 10

  ditto:
    image: ghcr.io/eargollo/ditto:latest
    container_name: ditto
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DITTO_PORT: 8180
      DATABASE_URL: postgres://ditto:ditto@postgres:5432/ditto?sslmode=disable
    # Mount folders to scan (paths inside container = scan roots in UI), e.g.:
    # volumes: ["/path/on/host/Photos:/scan/Photos:ro"]
    volumes: []
    ports:
      - "8180:8180"

volumes:
  ditto-postgres-data:
