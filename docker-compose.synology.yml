# Production example for Synology (or similar). Customize paths and user/group to match your NAS.
#
# Changes from a minimal setup:
# - Postgres healthcheck so Ditto only starts when the DB is ready (avoids migrate hang on cold start).
# - depends_on with condition: service_healthy so Ditto waits for Postgres.
#
# If you override entrypoint to /app/ditto, ensure any mounted scan paths are readable by PUID:PGID.

services:
  ditto:
    image: ghcr.io/eargollo/ditto:latest
    container_name: ditto
    restart: unless-stopped
    user: "1026:100"
    shm_size: "256mb"
    entrypoint: /app/ditto
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DITTO_PORT=8180
      - DATABASE_URL=postgres://ditto:ditto@postgres:5432/ditto?sslmode=disable
      - PUID=1026
      - PGID=100
    volumes:
      - /volume1/video:/volume1/video:ro
      - /volume1/Videos:/volume1/Videos:ro
      - /volume1/HomeData:/volume1/HomeData:ro
      - /volume1/Eduardo:/volume1/Eduardo:ro
      - /volume1/EduBackup:/volume1/EduBackup:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "8180:8180"

  postgres:
    image: postgres:18-alpine
    container_name: ditto-postgres
    restart: unless-stopped
    user: "1026:100"
    environment:
      POSTGRES_USER: ditto
      POSTGRES_PASSWORD: ditto
      POSTGRES_DB: ditto
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5435:5432"
    volumes:
      - /volume1/docker/ditto/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ditto -d ditto"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
