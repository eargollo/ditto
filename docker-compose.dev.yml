# Local development: PostgreSQL with two databases (same instance).
# Start with: docker compose -f docker-compose.dev.yml up -d
#
# Databases:
#   - ditto      — development (make run, UI, scans)
#   - ditto_test — tests (make test, go test; default when DATABASE_URL is unset)
#
# make run uses ditto; tests use ditto_test so dev data and test data stay separate.
# If the postgres volume already existed before adding the init script, create the test DB manually:
#   docker exec -it ditto-postgres-dev psql -U ditto -d ditto -c "CREATE DATABASE ditto_test;"

services:
  postgres:
    image: postgres:18-alpine
    container_name: ditto-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ditto
      POSTGRES_PASSWORD: ditto
      POSTGRES_DB: ditto
    ports:
      - "5432:5432"
    volumes:
      - ditto-postgres-dev:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d

volumes:
  ditto-postgres-dev:
