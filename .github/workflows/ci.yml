name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ditto
          POSTGRES_PASSWORD: ditto
          POSTGRES_DB: ditto
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Migrate
        env:
          DITTO_TEST_DATABASE_URL: postgres://ditto:ditto@localhost:5432/ditto?sslmode=disable
        run: go run ./cmd/ditto migrate

      - name: Run unit tests
        env:
          DITTO_TEST_DATABASE_URL: postgres://ditto:ditto@localhost:5432/ditto?sslmode=disable
        run: go test -p 1 -parallel 1 ./... -count=1

      - name: Run integration tests
        env:
          DITTO_TEST_DATABASE_URL: postgres://ditto:ditto@localhost:5432/ditto?sslmode=disable
        run: go test -tags=integration -p 1 -parallel 1 -count=1 ./internal/integration

      - name: Set version
        id: version
        run: |
          if [ -n "${{ github.ref_name }}" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(git describe --tags --always --dirty 2>/dev/null || echo 'dev')" >> $GITHUB_OUTPUT
          fi
      - name: Build
        run: |
          go build -v -ldflags "-X github.com/eargollo/ditto/internal/version.Version=${{ steps.version.outputs.version }}" -o /dev/null ./cmd/ditto

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ditto:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
